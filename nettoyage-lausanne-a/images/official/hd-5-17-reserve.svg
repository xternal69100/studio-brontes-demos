<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Référence Kärcher HD 5/17 CX Plus à confirmer</title>
  <desc id="desc">Plaque de réserve : aucun visuel d’une autre machine n’est affiché tant que la référence exacte n’est pas confirmée.</desc>
  <rect width="800" height="800" fill="#f1f1ef"/>
  <rect x="70" y="70" width="660" height="660" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M105 600H695M105 200H695" stroke="#111" stroke-width="2"/>
  <text x="105" y="150" fill="#111" font-family="Arial,sans-serif" font-size="20" letter-spacing="5">RÉSERVE DE PLAQUE</text>
  <text x="105" y="350" fill="#111" font-family="Arial,sans-serif" font-size="58">HD 5/17</text>
  <text x="105" y="415" fill="#111" font-family="Arial,sans-serif" font-size="58">CX PLUS</text>
  <text x="105" y="505" fill="#555" font-family="Arial,sans-serif" font-size="20">Référence exacte à confirmer</text>
  <text x="105" y="535" fill="#555" font-family="Arial,sans-serif" font-size="20">Aucun visuel substitué</text>
  <text x="105" y="660" fill="#111" font-family="Arial,sans-serif" font-size="20" letter-spacing="3">LOCATION LAUSANNE · V2</text>
</svg>
